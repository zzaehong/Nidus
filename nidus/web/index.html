<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nidus · Local Office</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside class="navigation"><a class="brand" href="#home"><span class="logo">N</span>NIDUS</a><small>YOUR LOCAL OFFICE</small><nav id="nav"></nav><footer><small>현재 Vault</small><div id="vault"></div><span class="local-dot">● 로컬 연결</span></footer></aside><main><header><div><small>WORKSPACE / NIDUS</small><h1 id="heading">Dashboard</h1></div><div class="toolbar"><button id="refresh">새로고침</button><button id="new-plan" class="primary">+ 새 Plan 만들기</button></div></header><div id="notice" role="status" aria-live="polite"></div><section id="content"></section></main><dialog id="create"><form id="create-form"><div class="modal-heading"><h2>새 Plan 만들기</h2><button type="button" id="close-create">닫기</button></div><label>사용자 요청<textarea name="request" required placeholder="어떤 결과를 만들고 싶으신가요?"></textarea></label><label>Sources · Vault 기준 경로, 한 줄에 하나<textarea name="sources" required placeholder="notes.md"></textarea></label><label>Planning model policy · JSON<textarea name="policy" required placeholder='{"routes": [...]}'></textarea></label><details><summary>고급 설정</summary><div id="advanced"></div><div class="limits"><label>Initial tasks<input name="initial_tasks" type="number" value="10" min="1" max="100"></label><label>Total tasks<input name="total_tasks" type="number" value="20" min="1" max="100"></label><label>Revisions<input name="revisions" type="number" value="5" min="0" max="20"></label></div></details><p class="muted">정책에는 인증정보를 넣지 마세요. 새 Plan은 자동으로 실행되지 않습니다.</p><button class="primary" type="submit">Plan 만들기</button></form></dialog></body></html>
