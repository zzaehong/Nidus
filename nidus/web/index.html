<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nidus · Local Office</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside class="navigation"><a class="brand" href="#home"><span class="logo">N</span>NIDUS</a><small>YOUR LOCAL OFFICE</small><nav id="nav"></nav><footer><small>현재 Vault</small><div id="vault"></div><span class="local-dot">● 로컬 연결</span></footer></aside><main><header><div><small>WORKSPACE / NIDUS</small><h1 id="heading">Dashboard</h1></div><div class="toolbar"><button id="refresh">새로고침</button><button id="new-plan" class="primary">+ 새 Plan 만들기</button></div></header><div id="notice" role="status" aria-live="polite"></div><section id="content"></section></main><dialog id="create"><form id="create-form"><div class="modal-heading"><h2>새 Plan 만들기</h2><button type="button" id="close-create">닫기</button></div><label>무엇을 할까요?<textarea name="request" required maxlength="8192" placeholder="예: Vault의 제품 조사 자료를 바탕으로 경쟁 제품 비교 보고서를 만들어줘."></textarea></label><button type="button" id="suggest-plan" class="primary">요청 분석 및 구성 추천</button><section id="plan-suggestions" hidden></section><details><summary>작업 한도</summary><div class="limits"><label>Initial tasks<input name="initial_tasks" type="number" value="10" min="1" max="100"></label><label>Total tasks<input name="total_tasks" type="number" value="20" min="1" max="100"></label><label>Revisions<input name="revisions" type="number" value="5" min="0" max="20"></label></div></details><p class="muted">추천은 Vault 안에서 처리됩니다. 실제 AI 호출은 다음 실행 단계에서 선택 범위를 확인하고 승인한 뒤 시작합니다. 모델 사용료가 발생할 수 있습니다.</p><button id="submit-plan" class="primary" type="submit" disabled>Plan 만들기</button></form></dialog></body></html>
