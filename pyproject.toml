[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nidus-router"
version = "0.1.0"
description = "Local, prompt-aware AI API router for Nidus"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "keyring>=25,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[project.scripts]
nidus-router = "nidus_router.__main__:main"

[tool.setuptools.packages.find]
include = ["nidus_router*"]

[tool.setuptools.package-data]
nidus_router = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/router"]
asyncio_mode = "auto"
